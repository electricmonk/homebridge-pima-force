version: 2.1

# Mirrors the `test` job in .github/workflows/ci.yml, and publishes JUnit
# results so CircleCI's Tests tab (and test insights) are populated.
#
# Node's built-in test runner writes JUnit natively: each run uses two
# reporters, spec to stdout for the step log and junit to a file for
# store_test_results. The junit destination directory must exist first.

jobs:
  test:
    parameters:
      node-version:
        type: string
      homebridge-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    environment:
      HB_VERSION: << parameters.homebridge-version >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-<< parameters.node-version >>-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-<< parameters.node-version >>-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run install:homebridge
      - run: npm run hb:dev:link
      - run: npm run build
      - run: mkdir -p test-results/unit test-results/e2e
      - run:
          name: Unit and integration tests
          command: >-
            node --import tsx --test
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=test-results/unit/results.xml
            src/*.test.ts
      - run:
          name: E2E tests
          when: always
          command: >-
            node --import tsx --test --test-concurrency=1
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=test-results/e2e/results.xml
            src/e2e/*.test.ts
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

workflows:
  ci:
    jobs:
      - test:
          matrix:
            parameters:
              node-version: ["22", "24"]
              homebridge-version: ["^1.8.0", "^2.0.0"]
