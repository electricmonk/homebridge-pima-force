version: 2.1

# A step-for-step copy of the `test` job in .github/workflows/ci.yml, plus
# JUnit results for CircleCI's Tests tab.
#
# The npm scripts are unchanged: the reporters go in through NODE_OPTIONS.
# spec writes the usual log to stdout; .circleci/junit-reporter.mjs writes
# JUnit with the test file as each testcase's classname.

commands:
  npm-test:
    parameters:
      suite:
        type: string
    steps:
      - run:
          name: npm run test:<< parameters.suite >>
          when: always # demo only: run every suite even after one fails
          command: |
            mkdir -p test-results/<< parameters.suite >>
            npm run test:<< parameters.suite >>
          environment:
            NODE_OPTIONS: >-
              --test-reporter=spec --test-reporter-destination=stdout
              --test-reporter=./.circleci/junit-reporter.mjs
              --test-reporter-destination=test-results/<< parameters.suite >>/results.xml

jobs:
  test:
    parameters:
      node-version:
        type: string
      homebridge-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    environment:
      HB_VERSION: << parameters.homebridge-version >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-<< parameters.node-version >>-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-<< parameters.node-version >>-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run install:homebridge
      - run:
          name: Verify installed Homebridge major matches matrix
          command: |
            installed=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/homebridge/package.json')).version")
            expected_major=$(printf '%s' "$HB_VERSION" | sed -E 's/^[^0-9]*([0-9]+).*/\1/')
            installed_major=${installed%%.*}
            echo "Matrix HB_VERSION=$HB_VERSION → expecting major $expected_major; installed homebridge@$installed (major $installed_major)"
            if [ "$expected_major" != "$installed_major" ]; then
              echo "installed Homebridge major ($installed_major) does not match matrix ($expected_major)"
              exit 1
            fi
      - run: npm run build
      - npm-test:
          suite: unit
      - npm-test:
          suite: integration
      - npm-test:
          suite: e2e
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

workflows:
  ci:
    jobs:
      - test:
          name: test-node<< matrix.node-version >>-hb<< matrix.homebridge-version >>
          matrix:
            parameters:
              node-version: ["22", "24"]
              homebridge-version: ["^1.8.0", "^2.0.0"]
